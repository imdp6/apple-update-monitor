name: Check Apple Updates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # 每小时整点检查一次（UTC）
  workflow_dispatch:
    # 允许手动触发

concurrency:
  group: apple-check
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: pip install feedparser requests
      - run: python -m unittest discover -v

  check:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 允许写入 last_update_id.txt

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run update checker
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python check_update.py

      - name: Commit last update ID
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git add last_update_id.txt

          # 如果没有变更，不提交
          if ! git diff --staged --quiet; then
            git commit -m "Update last seen ID"
            git pull --rebase
            git push
          fi
